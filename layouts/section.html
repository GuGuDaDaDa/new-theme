{{ define "main" }}
  {{ $context := partial "list/context.html" . }}
  <section
    class="latest"
    aria-labelledby="latest-title"
    data-post-list
    data-list-id="{{ $context.listId }}"
    data-build-id="{{ $context.buildId }}"
    data-page="{{ $context.pager.PageNumber }}"
  >
    <header class="section-head">
      <div class="section-title">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 5h8M5 11h14M5 17h11"></path>
        </svg>
        <h1 id="latest-title">{{ i18n "list.allPosts" }}</h1>
        <span class="section-count"
          >{{ i18n "list.count" (dict "Count" $context.count) }}</span
        >
      </div>
    </header>
    {{ partial "list/cards.html" $context }}
    {{ partial "list/pagination.html" $context }}
    <p
      class="list-status"
      role="status"
      aria-live="polite"
      data-list-status
    ></p>
  </section>
{{ end }}
