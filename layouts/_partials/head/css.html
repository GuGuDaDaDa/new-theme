{{ with resources.Get "css/compiled.css" }}
  {{ $css := . | fingerprint }}
  <link
    rel="stylesheet"
    href="{{ $css.RelPermalink }}"
    integrity="{{ $css.Data.Integrity }}"
    crossorigin="anonymous"
  />
{{ else }}
  {{ errorf "Night Theme release is missing assets/css/compiled.css; install a complete theme release." }}
{{ end }}
