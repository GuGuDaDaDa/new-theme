<nav aria-label="主导航">
  {{- range site.Menus.main -}}
    {{- $item := . -}}
    {{- with .Page -}}
      {{- if or
        (eq .Type "about") (eq .Type "friends")
      -}}
        <a href="{{ .RelPermalink }}">{{ $item.Name }}</a>
      {{- end -}}
    {{- end -}}
  {{- end }}
  <button class="icon search-trigger" type="button" aria-label="打开搜索" title="搜索" data-search-trigger><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 5 5"/></svg></button>
  <div class="theme-control" data-theme-control>
    <button
      class="icon theme-toggle"
      type="button"
      aria-label="切换主题"
      data-theme-trigger
    >
      <svg
        class="theme-icon theme-icon-moon"
        aria-hidden="true"
        viewBox="0 0 24 24"
      >
        <path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z" />
      </svg>
      <svg
        class="theme-icon theme-icon-sun"
        aria-hidden="true"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="12" r="3.5" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
      <svg
        class="theme-icon theme-icon-system"
        aria-hidden="true"
        viewBox="0 0 24 24"
      >
        <rect x="3" y="4" width="18" height="13" rx="2" />
        <path d="M12 17v4M8 21h8" />
      </svg>
    </button>
  </div>
</nav>
