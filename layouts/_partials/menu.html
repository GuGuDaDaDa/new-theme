<nav aria-label="主导航">
  {{- range site.Menus.main -}}
    {{- $item := . -}}
    {{- with .Page -}}
      {{- if or
        (eq .Type "about") (eq .Type "friends")
      -}}
        <a href="{{ .RelPermalink }}">{{ $item.Name }}</a>
      {{- end -}}
    {{- end -}}
  {{- end }}
  <div class="theme-control" data-theme-control>
    <button
      class="icon theme-toggle"
      type="button"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="theme-menu"
      data-theme-trigger
    >
      <svg
        class="theme-icon theme-icon-moon"
        aria-hidden="true"
        viewBox="0 0 24 24"
      >
        <path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z" />
      </svg>
      <svg
        class="theme-icon theme-icon-sun"
        aria-hidden="true"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="12" r="3.5" />
        <path
          d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </svg>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu" hidden data-theme-menu>
      <span class="theme-menu-title">外观</span>
      <button type="button" role="menuitemradio" data-theme-option="light">
        <span>浅色</span><span class="theme-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" role="menuitemradio" data-theme-option="dark">
        <span>深色</span><span class="theme-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" role="menuitemradio" data-theme-option="system">
        <span>跟随系统</span
        ><span class="theme-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </div>
</nav>
