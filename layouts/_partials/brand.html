<a
  class="brand"
  href="{{ site.Home.RelPermalink }}"
  aria-label="{{ i18n "nav.brandHome" (dict "Site" site.Title) }}"
>
  {{ with site.Params.logo }}
    <img src="{{ . | relURL }}" alt="" width="47" height="47" />
  {{ else }}
    <svg
      aria-hidden="true"
      viewBox="0 0 48 48"
      width="47"
      height="47"
      fill="none"
    >
      <path
        d="M11 8v24c0 8 15 11 21 3 4-6 1-13-6-14h-6V8"
        stroke="currentColor"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m32 22 10 4-9 4M11 32l-6 5"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="27" cy="26" r="1.8" fill="currentColor" />
    </svg>
  {{ end }}
  <span
    >{{ if eq site.Title "BuGuLog" }}
      BuGu<span class="brand-light">Log</span>
    {{ else }}
      {{ site.Title }}
    {{ end }}<small>{{ site.Params.footerText }}</small></span
  >
</a>
