{{ define "main" }}
  <section class="not-found" aria-labelledby="not-found-title">
    <p class="not-found-code" aria-hidden="true">404</p>
    <h1 id="not-found-title">{{ i18n "notFound.title" }}</h1>
    <p class="not-found-text">{{ i18n "notFound.text" }}</p>
    <div class="not-found-actions">
      <a class="not-found-home" href="{{ site.Home.RelPermalink }}"
        >{{ i18n "notFound.home" }}</a
      >
      <button class="not-found-search" type="button" data-search-trigger>
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <circle cx="10.8" cy="10.8" r="6.3" />
          <path d="m16 16 5 5" />
        </svg>
        {{ i18n "search.label" }}
      </button>
    </div>
    <noscript>
      <p class="not-found-note">
        {{ i18n "notFound.noscriptBefore" }}
        {{ with site.GetPage "/posts" }}
          <a href="{{ .RelPermalink }}">{{ i18n "list.allPosts" }}</a>
        {{ else }}
          {{ i18n "notFound.noscriptFallback" }}
        {{ end }}。
      </p>
    </noscript>
  </section>
{{ end }}
