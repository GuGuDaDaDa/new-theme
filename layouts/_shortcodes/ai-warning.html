<aside
  class="ai-warning"
  data-ai-warning
  aria-label="{{ i18n "shortcode.aiWarning" }}"
>
  <span class="ai-warning-icon" aria-hidden="true" data-search-exclude>!</span>
  <div class="ai-warning-body">
    {{- with .Get "title" -}}
      <strong class="ai-warning-title">{{ . }}</strong
      ><span class="ai-warning-sep" aria-hidden="true">·</span>
    {{- end -}}
    {{ .Page.RenderString (dict "display" "inline") .Inner | replaceRE ` data-article-heading` "" | safeHTML }}
  </div>
  <button
    type="button"
    class="icon close-dialog ai-warning-close"
    data-notice-close
    data-search-exclude
    aria-label="{{ i18n "shortcode.aiWarningClose" }}"
    hidden
  >
    <svg aria-hidden="true" viewBox="0 0 24 24">
      <path d="m7 7 10 10M17 7 7 17" />
    </svg>
  </button>
</aside>
